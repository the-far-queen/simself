[pytest]
markers =
    slow: marks tests as slow (deselected by default; use --runslow to enable)
python_files = test_*.py
# Tests in this repo are named t_<ID> (t_I1..I5, t_W1..W4, t_H1..H6,
# t_E1..E8) as well as test_*. Without this line pytest collects ZERO
# from test_integration.py, test_wiring.py, test_handoff_void.py and
# test_dreaming.py.
#
# 32 tests — including the entire I1-I5 regression net for the
# 2026-10-06 state-integration fix — were invisible. The suite
# reported "112 passed"; it was actually 144. Every one passed once
# genuinely collected, so nothing was broken, only switched off.
#
# Same defect class as the unwired dreamer: a check that exists, reads
# as covered, and never runs.
python_functions = test_* t_*